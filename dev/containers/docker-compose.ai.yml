# -- DEV DOCKER-COMPOSE OVERLAY: AI SERVICE + CHAT APP + REVERSE PROXY --
# -- DO NOT USE IN PRODUCTION! --
#
# Adds the AI service and puts it on the same origin as the wiki, which is
# what the assistant panel's iframe needs. Use it alongside the base file:
#
#   docker compose -f dev/containers/docker-compose.yml \
#                  -f dev/containers/docker-compose.ai.yml up -d
#
# Then open the wiki at http://127.0.0.1:3080 (not 3002), so that /ai/* and
# the wiki share one origin.

services:
  # The index: Postgres with pgvector, for page chunks and their embeddings.
  # Reachable as ai-db:5432 inside the Docker network only.
  ai-db:
    container_name: wiki-ai-db
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: wiki_ai
      POSTGRES_USER: wiki_ai
      POSTGRES_PASSWORD: wiki_ai
    expose:
      - "5432"
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_ai -d wiki_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    container_name: wiki-ai
    build:
      context: ../../ai
      dockerfile: Dockerfile
    # Settings and the API key live in ai/.env, which is gitignored.
    # See ai/.env.example. The stack still starts without it.
    env_file:
      - path: ../../ai/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
    depends_on:
      ai-db:
        condition: service_healthy
    # Ollama runs natively on the Mac, not in a container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Reachable as ai:4000 inside the Docker network only; the proxy
    # is the only way in from the host.
    expose:
      - "4000"
    volumes:
      - ../../ai:/app
      - /app/node_modules

  # The chat app, in development: Vite with hot reload. In production the
  # Fastify service serves panel-ui/dist instead and this is not needed.
  panel-ui:
    container_name: wiki-panel-ui
    build:
      # ai/, not ai/panel-ui/: the app imports the schemas in ai/shared.
      context: ../../ai
      dockerfile: panel-ui/Dockerfile
    expose:
      - "5173"
    volumes:
      - ../../ai:/app
      - /app/panel-ui/node_modules

  proxy:
    container_name: wiki-proxy
    image: caddy:2.11.7-alpine
    depends_on:
      - wiki
      - ai
      - panel-ui
    ports:
      - "3080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  ai-db-data:
