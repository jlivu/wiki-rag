<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Assistant</title>
<style>
  /* Colours follow the Wiki.js theme, passed in as ?theme=light|dark. */
  :root[data-theme="light"] {
    --bg: #f5f5f5;
    --card: #ffffff;
    --border: rgba(0, 0, 0, 0.12);
    --text: rgba(0, 0, 0, 0.87);
    --muted: rgba(0, 0, 0, 0.6);
  }

  :root[data-theme="dark"] {
    --bg: #212121;
    --card: #2e2e2e;
    --border: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.7);
  }

  :root {
    --primary: #1976d2;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    padding: 14px 13px;
    background-color: var(--bg);
    color: var(--text);
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13.5px;
    line-height: 1.6;
  }

  .card {
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 11px 11px 11px 3px;
    background-color: var(--card);
  }

  .card-title {
    margin: 0;
    font-size: 13.5px;
    font-weight: 600;
  }

  .card-text {
    margin: 4px 0 0;
    color: var(--muted);
  }

  .meta {
    margin: 10px 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }

  .meta-row + .meta-row {
    margin-top: 6px;
  }

  .meta-label {
    margin: 0;
  }

  .meta-value {
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    overflow-wrap: anywhere;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }

  .btn {
    padding: 7px 14px;
    border: 0;
    border-radius: 4px;
    background-color: var(--primary);
    color: #fff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    cursor: pointer;
  }

  .btn:hover { filter: brightness(1.1); }

  .btn:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  .sent {
    font-size: 11.5px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main class="card">
    <h1 class="card-title">Connected to the AI service</h1>
    <p class="card-text">Development stub. The chat app replaces this page in the next step.</p>
    <div class="meta">
      <div class="meta-row">
        <p class="meta-label">Current page</p>
        <p class="meta-value" id="page-title"></p>
      </div>
      <div class="meta-row">
        <p class="meta-label">Path</p>
        <p class="meta-value" id="page-path"></p>
      </div>
    </div>
  </main>
  <div class="actions">
    <button class="btn" type="button" id="close-btn">Test close</button>
    <span class="sent" id="sent" role="status" aria-live="polite"></span>
  </div>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search)
    var theme = params.get('theme') === 'dark' ? 'dark' : 'light'
    var locale = params.get('locale') || ''
    var path = params.get('path') || ''
    var title = params.get('title') || ''

    document.documentElement.setAttribute('data-theme', theme)

    // textContent, never innerHTML: these values come from the query string.
    document.getElementById('page-title').textContent = title || 'Untitled page'
    document.getElementById('page-path').textContent = '/' + [locale, path].filter(Boolean).join('/')

    // The panel only accepts messages from its own origin.
    function postToWiki (message) {
      window.parent.postMessage(message, window.location.origin)
      document.getElementById('sent').textContent = 'Sent ' + message.type
    }

    postToWiki({ type: 'wiki-ai:status', label: 'Dev stub', online: true })

    document.getElementById('close-btn').addEventListener('click', function () {
      postToWiki({ type: 'wiki-ai:close' })
    })
  })()
</script>
</body>
</html>
