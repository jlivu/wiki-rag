key: rag
title: AI Assistant Index
description: Tells the AI assistant when a page changes, so its search index stays current. Sends only the page id, path and locale; it never writes files anywhere.
author: doft.gov.vu
logo: data:image/svg+xml;base64,
website: https://github.com/requarks/wiki
isAvailable: true
supportedModes:
  - push
defaultMode: push
schedule: PT30M
props:
  indexerUrl:
    type: String
    default: http://ai:4000
    title: AI service URL
    hint: Where the AI service answers inside the Docker network. Its indexer routes are not published through the reverse proxy.
    order: 1
  timeoutMs:
    type: Number
    default: 2000
    title: Timeout (ms)
    hint: How long to let a notification take before abandoning it. Saving a page never waits for the reply, so this only bounds the background request.
    order: 2
actions:
  - handler: reindexAll
    label: Re-index everything
    hint: Throw away the assistant's index and build it again from every published page. Safe to run at any time; the wiki itself is not touched.
  - handler: syncNow
    label: Reconcile now
    hint: Compare the assistant's index with the page list straight away, instead of waiting for the next scheduled sync.
